<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="top-bar">
    <span id="clock" class="clock"></span>
    <button id="theme-toggle" class="btn-icon" title="Toggle light/dark mode">🌙</button>
  </header>

  <main class="dashboard">

    <!-- ===== GREETING ===== -->
    <section class="card greeting-card">
      <h1 id="greeting-text" class="greeting"></h1>
      <p id="date-text" class="date"></p>

      <!-- Challenge: Custom name -->
      <div class="name-row">
        <input type="text" id="name-input" class="name-input" placeholder="Enter your name…" maxlength="40" />
        <button id="name-save" class="btn btn-sm">Save</button>
      </div>
    </section>

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card timer-card">
      <h2 class="section-title">Focus Timer</h2>

      <!-- Challenge: Change Pomodoro time -->
      <div class="timer-settings">
        <label for="pomodoro-minutes">Set minutes:</label>
        <input type="number" id="pomodoro-minutes" class="time-input" min="1" max="90" value="25" />
        <button id="apply-time" class="btn btn-sm">Apply</button>
      </div>

      <div id="timer-display" class="timer-display">25:00</div>

      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop"  class="btn btn-secondary">Stop</button>
        <button id="timer-reset" class="btn btn-secondary">Reset</button>
      </div>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="card todo-card">
      <h2 class="section-title">To-Do List</h2>

      <div class="todo-add-row">
        <input type="text" id="todo-input" class="todo-input" placeholder="Add a task…" maxlength="120" />
        <button id="todo-add" class="btn btn-primary">Add</button>
      </div>

      <!-- Challenge: Sort tasks -->
      <div class="todo-toolbar">
        <label for="sort-select">Sort:</label>
        <select id="sort-select" class="sort-select">
          <option value="default">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
        </select>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="card links-card">
      <h2 class="section-title">Quick Links</h2>

      <div class="links-add-row">
        <input type="text" id="link-name-input" class="link-input" placeholder="Label" maxlength="30" />
        <input type="url" id="link-url-input"  class="link-input" placeholder="https://…" />
        <button id="link-add" class="btn btn-primary">Add</button>
      </div>

      <div id="links-grid" class="links-grid"></div>
    </section>

  </main>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Edit Task</h3>
      <input type="text" id="edit-input" class="todo-input" maxlength="120" />
      <div class="modal-actions">
        <button id="edit-save" class="btn btn-primary">Save</button>
        <button id="edit-cancel" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
